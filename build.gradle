plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = mod_version
group = 'dev.mcbridge'
base { archivesName = "${mod_id}-neoforge-${minecraft_version}" }

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = neo_version
    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
            if (project.hasProperty('quickPlay')) {
                programArguments.addAll '--quickPlaySingleplayer', project.property('quickPlay').toString()
            }
        }
    }
    mods {
        "${mod_id}" { sourceSet sourceSets.main }
    }
}

processResources {
    var props = [mod_id: mod_id, mod_version: mod_version, neo_version: neo_version]
    inputs.properties props
    filesMatching('META-INF/neoforge.mods.toml') { expand props }
}

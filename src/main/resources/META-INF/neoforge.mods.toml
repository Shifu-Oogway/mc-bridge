modLoader = "javafml"
loaderVersion = "[4,)"
license = "MIT"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "MC Bridge"
description = "Exposes game state and input to an external agent over a local, token-authenticated socket."

[[mixins]]
config = "mcbridge.mixins.json"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "[21.1,)"
ordering = "NONE"
side = "CLIENT"

[[dependencies.${mod_id}]]
modId = "create"
type = "optional"
versionRange = "[6.0.9,7)"
ordering = "AFTER"
side = "CLIENT"
